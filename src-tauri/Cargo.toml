[package]
name = "diagrammy"
version = "0.1.0"
description = "Local-first diagram browser for Markdown files"
authors = ["you"]
edition = "2021"

[lib]
name = "diagrammy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
